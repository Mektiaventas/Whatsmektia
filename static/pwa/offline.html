<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002663">
  <title>Sin conexión</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:#002663;color:#ECEFF4;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    h1{color:#FFC20E;font-size:1.4rem;margin:0 0 .5rem}
    p{opacity:.85;margin:0 0 1.5rem;line-height:1.4}
    button{background:#FFC20E;color:#002663;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1rem}
  </style>
</head>
<body>
  <div>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento.<br>Revisa tu conexión e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
